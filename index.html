<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>loading...</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- JetBrains Mono for body/UI, Determination Mono for headings -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>

  <!-- Determination Mono (Undertale font) via CDN -->
  <style>
    @font-face {
      font-family: 'Determination';
      src: url('https://fonts.cdnfonts.com/s/14288/DeterminationMonoWebRegular.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }
  </style>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #080C12;
      --surface:    #0F1620;
      --surface2:   #151E2D;
      --border:     #1A2638;
      --border2:    #243349;
      --green:      #00D26A;
      --green-dim:  #007a3e;
      --green-glow: #00D26A15;
      --green-soft: #00D26A30;
      --text:       #DDE6F0;
      --muted:      #5A7091;
      --muted2:     #7A91A8;
      --mono:       'JetBrains Mono', 'Courier New', monospace;
      --head:       'Determination', 'JetBrains Mono', monospace;
      --det:        'Determination', 'JetBrains Mono', monospace;
      --sans:       'JetBrains Mono', 'Courier New', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      line-height: 1.6;
      overflow-x: hidden;
      font-weight: 400;
    }

    /* subtle dot grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, var(--border2) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    /* ── SCROLL BAR ── */
    #scroll-bar {
      position: fixed; top: 0; left: 0;
      height: 2px; width: 0%;
      background: linear-gradient(90deg, var(--green), #00ffaa);
      box-shadow: 0 0 12px var(--green);
      z-index: 9999;
      transition: width 0.06s linear;
    }

    /* ── NAVBAR ── */
    #navbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 58px;
      background: rgba(8,12,18,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 3rem;
      gap: 1.5rem;
      z-index: 900;
    }

    .nav-brand {
      font-family: var(--det);
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.15em;
      flex-shrink: 0;
    }

    .nav-brand .nb-cursor {
      color: var(--green);
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* working-on ticker */
    .nav-ticker {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      padding: 0.2rem 0.6rem;
      overflow: hidden;
      max-width: 220px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .nt-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

    .nt-scroll {
      display: inline-block;
      animation: scrollTicker 12s linear infinite;
    }

    @keyframes scrollTicker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.1rem;
      margin-left: auto;
    }

    .nav-links a {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted2);
      text-decoration: none;
      padding: 0.32rem 0.7rem;
      border-radius: 4px;
      border: 1px solid transparent;
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--green);
      border-color: var(--border2);
      background: var(--green-glow);
    }

    /* music btn — always visible */
    #music-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--muted2);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
      flex-shrink: 0;
      min-width: 80px;
    }

    #music-btn:hover { color: var(--green); border-color: var(--green-dim); }

    #music-btn.playing {
      color: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
    }

    /* equaliser bars when playing */
    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .eq-bars span {
      width: 2px;
      background: var(--green);
      border-radius: 1px;
      animation: none;
    }

    .playing .eq-bars span:nth-child(1) { animation: eq 0.8s ease-in-out infinite; }
    .playing .eq-bars span:nth-child(2) { animation: eq 0.6s ease-in-out 0.1s infinite; }
    .playing .eq-bars span:nth-child(3) { animation: eq 1.0s ease-in-out 0.2s infinite; }
    .playing .eq-bars span:nth-child(4) { animation: eq 0.7s ease-in-out 0.05s infinite; }

    @keyframes eq {
      0%,100% { height: 3px; }
      50%      { height: 12px; }
    }

    /* ── PAGE ── */
    .page { position: relative; z-index: 1; padding-top: 58px; }

    /* ── HERO ── */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem 6rem 0;
      position: relative;
      overflow: hidden;
    }

    /* large decorative bg text */
    .hero-bg-text {
      position: absolute;
      bottom: -0.05em;
      right: -0.04em;
      font-family: var(--det);
      font-size: clamp(7rem, 20vw, 18rem);
      color: var(--green);
      opacity: 0.035;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    .hero-inner {
      display: flex;
      align-items: flex-start;
      gap: 3.5rem;
      margin-bottom: 4rem;
    }

    /* avatar */
    .hero-avatar {
      flex-shrink: 0;
      position: relative;
    }

    .hero-avatar img {
      display: block;
      object-fit: cover;
      position: relative;
      z-index: 1;
    }

    /* glowing ring behind avatar */
    .hero-avatar::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: inherit;
      background: radial-gradient(circle, var(--green-soft), transparent 70%);
      z-index: 0;
      animation: avatarGlow 3s ease-in-out infinite;
    }

    @keyframes avatarGlow { 0%,100%{opacity:0.5} 50%{opacity:1} }

    .hero-content { flex: 1; min-width: 0; }

    /* console */
    .hero-console {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      line-height: 2.1;
      padding-left: 1rem;
      border-left: 2px solid var(--border2);
    }

    .hc-time { color: var(--border2); }
    .hc-info { color: var(--green); font-weight: 600; }

    /* title */
    .hero-title {
      font-family: var(--det);
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      line-height: 1.2;
      letter-spacing: 0.02em;
      margin-bottom: 1.4rem;
      min-height: 4.2em;
    }

    .tl {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      opacity: 0;
      color: var(--text);
    }

    .tl.vis { opacity: 1; }
    .tl:first-child { color: var(--green); }

    .hero-bio {
      font-family: var(--mono);
      font-size: 0.88rem;
      font-weight: 400;
      color: var(--muted2);
      max-width: 520px;
      line-height: 1.8;
      margin-bottom: 2.5rem;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .hero-bio.vis { opacity: 1; }

    .hero-cta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .hero-cta.vis { opacity: 1; }

    /* buttons */
    .btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 0.7rem 1.5rem;
      border-radius: 5px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.18s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 0.03em;
    }

    .btn-primary {
      background: var(--green);
      color: #020d05;
      border: 1px solid var(--green);
      font-weight: 700;
    }

    .btn-primary:hover {
      box-shadow: 0 0 28px var(--green-soft), 0 0 8px var(--green);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border2);
    }

    .btn-ghost:hover {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-glow);
      transform: translateY(-1px);
    }

    /* stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border);
    }

    .stat-item {
      padding: 2.25rem 2rem;
      border-right: 1px solid var(--border);
      position: relative;
    }

    .stat-item:last-child { border-right: none; }

    .stat-num {
      font-family: var(--det);
      font-size: 2.8rem;
      color: var(--green);
      line-height: 1;
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }

    .stat-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── SECTION BASE ── */
    .section {
      padding: 7rem 6rem;
      border-top: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--green);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .eyebrow::before {
      content: '';
      width: 20px;
      height: 1px;
      background: var(--green);
    }

    .section-title {
      font-family: var(--det);
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: normal;
      letter-spacing: 0.02em;
      margin-bottom: 0.6rem;
      line-height: 1.1;
    }

    .section-sub {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted2);
      max-width: 480px;
      line-height: 1.9;
      margin-bottom: 3.5rem;
      font-weight: 400;
    }

    /* ── ABOUT ── */
    .about-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 4rem;
      align-items: start;
    }

    .about-paras p {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted2);
      line-height: 1.9;
      margin-bottom: 1.1rem;
      font-weight: 400;
    }

    .about-paras p b { color: var(--text); font-weight: 600; }
    .about-paras p:last-child { margin-bottom: 0; }

    .about-right { display: flex; flex-direction: column; gap: 1rem; }

    /* config blocks */
    .cfg-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .cfg-topbar {
      background: var(--surface2);
      padding: 0.38rem 1rem;
      font-family: var(--mono);
      font-size: 0.63rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .cfg-topbar .cf { color: var(--green); }

    .cfg-body {
      padding: 0.85rem 1rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      line-height: 2;
    }

    .ck { color: #7db9ff; }
    .cv { color: #c792ea; }
    .cs { color: #a8d8a8; }

    /* ── PROJECTS ── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.22s, transform 0.22s, box-shadow 0.22s;
      cursor: default;
    }

    .project-card:hover {
      border-color: var(--green);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 24px var(--green-glow);
    }

    .pc-topbar {
      background: var(--surface2);
      padding: 0.4rem 1rem;
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .pc-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

    .pc-badge {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.57rem;
      padding: 0.12rem 0.48rem;
      border-radius: 3px;
      background: var(--green-glow);
      border: 1px solid var(--green-dim);
      color: var(--green);
      letter-spacing: 0.03em;
    }

    .pc-img {
      overflow: hidden;
      flex-shrink: 0;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      cursor: zoom-in;
      position: relative;
    }

    .pc-img img {
      display: block;
      width: 100%;
      transition: transform 0.4s ease;
    }

    .pc-img:hover img { transform: scale(1.05); }

    .pc-img .zoom-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8,12,18,0.5);
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      letter-spacing: 0.05em;
    }

    .pc-img:hover .zoom-hint { opacity: 1; }

    .pc-img .img-ph {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--border2);
      text-align: center;
      padding: 3.5rem;
    }

    .pc-body {
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .pc-type {
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--green);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .pc-name {
      font-family: var(--det);
      font-size: 1rem;
      line-height: 1.25;
      margin-bottom: 0.7rem;
      text-decoration: none;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.15s;
      letter-spacing: 0.02em;
    }

    .pc-name.linkable:hover { color: var(--green); }

    .pc-name .arr {
      font-family: var(--mono);
      font-size: 0.72rem;
      opacity: 0.35;
      transition: opacity 0.15s, transform 0.15s;
    }

    .pc-name.linkable:hover .arr { opacity: 1; transform: translate(2px, -2px); }

    .pc-desc {
      font-size: 0.82rem;
      color: var(--muted2);
      line-height: 1.7;
      margin-bottom: 1.1rem;
      flex: 1;
      font-weight: 400;
    }

    .pc-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }

    .tag {
      font-family: var(--mono);
      font-size: 0.57rem;
      padding: 0.17rem 0.48rem;
      border: 1px solid var(--border2);
      border-radius: 3px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    /* ── CONTACT ── */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: start;
    }

    .contact-left p {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted2);
      line-height: 1.9;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    .discord-btn {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 7px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s;
      position: relative;
    }

    .discord-btn:hover {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-glow);
      transform: translateX(3px);
    }

    .discord-btn .dc-tag {
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .dc-copy-label {
      margin-left: auto;
      font-size: 0.6rem;
      color: var(--muted);
      transition: color 0.15s;
    }

    .discord-btn:hover .dc-copy-label,
    .discord-btn.copied .dc-copy-label { color: var(--green); }

    .contact-right {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .cr-bar {
      background: var(--surface2);
      padding: 0.42rem 1rem;
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cr-bar .cf { color: var(--green); }

    .cr-body {
      padding: 1rem 1.1rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      line-height: 2.1;
      color: var(--muted);
    }

    .cr-body .cp { color: #7db9ff; }
    .cr-body .cv { color: var(--text); }

    /* ── FOOTER ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 2rem 6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.63rem;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    .footer-hint {
      cursor: pointer;
      transition: color 0.15s;
      user-select: none;
    }

    .footer-hint:hover { color: var(--green); }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 8000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s;
    }

    #lightbox.open { opacity: 1; pointer-events: all; }

    #lightbox img {
      max-width: 90vw;
      max-height: 84vh;
      border-radius: 8px;
      border: 1px solid var(--border2);
      object-fit: contain;
      box-shadow: 0 0 80px rgba(0,0,0,0.8);
    }

    #lb-close {
      position: absolute;
      top: 1.25rem; right: 1.5rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    #lb-close:hover { color: var(--green); border-color: var(--green); }

    /* ── EASTER EGG TERMINAL ── */
    #ee {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      width: 400px;
      background: var(--surface);
      border: 1px solid var(--green-dim);
      border-radius: 8px;
      overflow: hidden;
      z-index: 7000;
      opacity: 0;
      transform: translateY(12px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      box-shadow: 0 0 50px rgba(0,210,106,0.1), 0 8px 40px rgba(0,0,0,0.6);
    }

    #ee.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .ee-bar {
      background: var(--surface2);
      padding: 0.48rem 1rem;
      font-family: var(--mono);
      font-size: 0.63rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .ee-bar .ee-t { color: var(--green); }
    .ee-bar .ee-x { margin-left: auto; cursor: pointer; transition: color 0.15s; padding: 0 0.2rem; }
    .ee-bar .ee-x:hover { color: var(--text); }

    #ee-output {
      padding: 0.9rem 1.1rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      line-height: 1.95;
      color: var(--muted2);
      max-height: 230px;
      overflow-y: auto;
      min-height: 55px;
    }

    #ee-output .eg { color: var(--green); }
    #ee-output .ew { color: #f0a050; }
    #ee-output .ep { color: var(--muted); }

    .ee-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.55rem 1.1rem;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .ee-p { color: var(--green); font-family: var(--mono); font-size: 0.68rem; flex-shrink: 0; }

    #ee-input {
      background: transparent;
      border: none; outline: none;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text);
      flex: 1;
      caret-color: var(--green);
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface);
      border: 1px solid var(--green-dim);
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--green);
      padding: 0.5rem 1.25rem;
      z-index: 9500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ── */
    @media (max-width: 1100px) {
      #hero { padding: 5rem 3.5rem 0; }
      .section { padding: 6rem 3.5rem; }
      .footer { padding: 1.75rem 3.5rem; }
      .projects-grid { grid-template-columns: repeat(2, 1fr); }
      .about-grid, .contact-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    }

    @media (max-width: 700px) {
      #navbar { padding: 0 1.25rem; gap: 0.85rem; }
      .nav-ticker { display: none; }
      .nav-links a { font-size: 0.65rem; padding: 0.28rem 0.55rem; }
      #hero { padding: 4rem 1.5rem 0; }
      .hero-inner { flex-direction: column; gap: 1.75rem; }
      .section { padding: 4.5rem 1.5rem; }
      .projects-grid { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .stat-item:nth-child(even) { border-right: none; }
      .stat-item:nth-child(1),
      .stat-item:nth-child(2) { border-bottom: 1px solid var(--border); }
      .footer { padding: 1.5rem; flex-direction: column; gap: 0.5rem; text-align: center; }
      #ee { width: calc(100vw - 2rem); right: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nb-cursor, .nt-dot { animation: none; }
      .nt-scroll { animation: none; }
      .eq-bars span { animation: none !important; }
      .hero-avatar::before { animation: none; }
    }
  </style>
</head>
<body>
<script src="config.js"></script>

<!-- progress bar -->
<div id="scroll-bar"></div>

<!-- lightbox -->
<div id="lightbox">
  <div id="lb-close">esc / close</div>
  <img id="lb-img" src="" alt=""/>
</div>

<!-- easter egg terminal -->
<div id="ee">
  <div class="ee-bar">
    <span class="ee-t">server@lostgalaxy:~$</span>
    <span class="ee-x" id="ee-x">[ x ]</span>
  </div>
  <div id="ee-output"><span class="eg">Terminal active. Type 'help' to list commands.</span></div>
  <div class="ee-row">
    <span class="ee-p">$</span>
    <input id="ee-input" type="text" autocomplete="off" spellcheck="false" placeholder="enter command..."/>
  </div>
</div>

<!-- toast -->
<div id="toast"></div>

<!-- audio -->
<audio id="bgm" loop></audio>

<!-- navbar -->
<nav id="navbar"></nav>

<!-- page -->
<div class="page">
  <section id="hero"></section>
  <section id="about"    class="section"></section>
  <section id="projects" class="section"></section>
  <section id="contact"  class="section"></section>
  <footer class="footer" id="footer"></footer>
</div>

<script>
/* ============================================================
   Render engine. Do not edit below this line.
   ============================================================ */
const C = CONFIG;

/* accent color */
document.documentElement.style.setProperty('--green', C.accentColor || '#00D26A');
document.title = C.pageTitle || C.name;

/* ── UTILS ── */
function qs(sel, ctx) { return (ctx || document).querySelector(sel); }
function ce(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls)  e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function showToast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms || 1800);
}

/* ── SCROLL BAR ── */
window.addEventListener('scroll', () => {
  const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
  document.getElementById('scroll-bar').style.width = Math.min(pct, 100) + '%';
}, { passive: true });

/* ── MUSIC (autoplay with unlock fallback) ── */
const bgm = document.getElementById('bgm');
let musicPlaying = false;
let musicUnlocked = false;

function setMusicUI(playing) {
  const btn = document.getElementById('music-btn');
  if (!btn) return;
  const label = qs('span', btn);
  const bars  = qs('.eq-bars', btn);
  if (playing) {
    btn.classList.add('playing');
    if (label) label.textContent = 'pause';
  } else {
    btn.classList.remove('playing');
    if (label) label.textContent = 'play';
  }
}

function tryAutoplay() {
  if (!C.music || !C.music.enabled) return;
  bgm.src    = C.music.src;
  bgm.volume = 0.6;

  bgm.play().then(() => {
    musicPlaying  = true;
    musicUnlocked = true;
    setMusicUI(true);
  }).catch(() => {
    /* Autoplay blocked — unlock on first interaction */
    const unlock = () => {
      if (musicUnlocked) return;
      musicUnlocked = true;
      bgm.play().then(() => {
        musicPlaying = true;
        setMusicUI(true);
      }).catch(() => {});
      document.removeEventListener('click', unlock);
      document.removeEventListener('keydown', unlock);
    };
    document.addEventListener('click',   unlock, { once: true });
    document.addEventListener('keydown', unlock, { once: true });
  });
}

function toggleMusic() {
  if (!C.music || !C.music.enabled) return;
  if (!bgm.src || bgm.src === window.location.href) bgm.src = C.music.src;

  if (musicPlaying) {
    bgm.pause();
    musicPlaying = false;
    setMusicUI(false);
  } else {
    bgm.play().then(() => {
      musicPlaying  = true;
      musicUnlocked = true;
      setMusicUI(true);
    }).catch(() => showToast('Could not load audio file.'));
  }
}

/* ── LIGHTBOX ── */
const lb    = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');

function openLB(src, alt) {
  lbImg.src = src; lbImg.alt = alt || '';
  lb.classList.add('open');
}
function closeLB() { lb.classList.remove('open'); }

document.getElementById('lb-close').addEventListener('click', closeLB);
lb.addEventListener('click', e => { if (e.target === lb) closeLB(); });

/* ── EASTER EGG ── */
const eePanel  = document.getElementById('ee');
const eeInput  = document.getElementById('ee-input');
const eeOutput = document.getElementById('ee-output');
let eeHistory  = [];

function openEE()  { eePanel.classList.add('open'); eeInput.focus(); }
function closeEE() { eePanel.classList.remove('open'); }

document.getElementById('ee-x').addEventListener('click', closeEE);

function eeAppend(html) {
  eeHistory.push(html);
  if (eeHistory.length > 40) eeHistory.shift();
  eeOutput.innerHTML = eeHistory.join('<br>');
  eeOutput.scrollTop = eeOutput.scrollHeight;
}

eeInput.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  const raw = this.value.trim();
  this.value = '';
  if (!raw) return;

  eeAppend(`<span class="ep">$</span> <span style="color:var(--text)">${raw}</span>`);
  const cmd  = raw.toLowerCase();
  const cmds = C.easterEggCommands || {};

  if (cmd === 'clear') {
    eeHistory = [];
    eeOutput.innerHTML = '';
    return;
  }

  if (Object.prototype.hasOwnProperty.call(cmds, cmd)) {
    const v = cmds[cmd];
    if (v === '__EXIT__') {
      eeAppend('<span class="eg">Closing terminal...</span>');
      setTimeout(closeEE, 600);
    } else {
      eeAppend(`<span class="eg">${v}</span>`);
    }
  } else {
    eeAppend(`<span class="ew">command not found:</span> ${raw} &mdash; try 'help'`);
  }
});

/* type "help" or "sudo" anywhere to open terminal */
let keyBuf = '';
document.addEventListener('keydown', e => {
  if (eePanel.classList.contains('open')) return;
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  keyBuf = (keyBuf + e.key).slice(-6).toLowerCase();
  if (keyBuf.includes('help') || keyBuf.includes('sudo')) {
    keyBuf = '';
    openEE();
  }
});

/* ESC closes both */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeLB();
  closeEE();
});

/* ── NAVBAR ── */
(function() {
  const nav = document.getElementById('navbar');

  /* brand */
  const brand = ce('a', 'nav-brand');
  brand.href = '#hero';
  brand.innerHTML = `${C.name}<span class="nb-cursor">_</span>`;
  nav.appendChild(brand);

  /* ticker */
  if (C.currentlyWorkingOn) {
    const txt = `working on: ${C.currentlyWorkingOn} &nbsp;&nbsp;&nbsp;&nbsp; working on: ${C.currentlyWorkingOn} &nbsp;&nbsp;&nbsp;&nbsp;`;
    const ticker = ce('div', 'nav-ticker');
    ticker.innerHTML = `<span class="nt-dot"></span><span class="nt-scroll">${txt}</span>`;
    nav.appendChild(ticker);
  }

  /* links */
  const links = ce('div', 'nav-links');
  [['#hero','home'],['#about','about'],['#projects','projects'],['#contact','contact']].forEach(([h,l]) => {
    const a = ce('a'); a.href = h; a.textContent = l;
    links.appendChild(a);
  });
  nav.appendChild(links);

  /* music button */
  if (C.music && C.music.enabled) {
    const btn = ce('div', '');
    btn.id = 'music-btn';
    btn.innerHTML = `
      <svg id="music-play-icon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
      <svg id="music-pause-icon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>
      </svg>
      <div class="eq-bars"><span></span><span></span><span></span><span></span></div>
      <span>play</span>
    `;

    btn.addEventListener('click', () => {
      toggleMusic();
      qs('#music-play-icon').style.display  = musicPlaying ? 'none'  : '';
      qs('#music-pause-icon').style.display = musicPlaying ? ''      : 'none';
    });

    /* override setMusicUI to also toggle icons */
    const _orig = setMusicUI;
    window.setMusicUI = function(playing) {
      _orig(playing);
      const pi = document.getElementById('music-play-icon');
      const pa = document.getElementById('music-pause-icon');
      if (pi) pi.style.display  = playing ? 'none' : '';
      if (pa) pa.style.display  = playing ? ''     : 'none';
    };

    nav.appendChild(btn);
  }

  /* active link tracking */
  const secs = document.querySelectorAll('section[id]');
  const navAs = links.querySelectorAll('a');
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting)
        navAs.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id));
    });
  }, { threshold: 0.3 });
  secs.forEach(s => io.observe(s));
})();

/* ── HERO ── */
(function() {
  const sec = document.getElementById('hero');
  const av  = C.avatar || {};

  /* avatar */
  let avatarHTML = '';
  if (av.visible !== false) {
    const r  = av.shape === 'circle' ? '50%' : av.shape === 'rounded' ? '14px' : '4px';
    const br = av.border ? `border:2.5px solid var(--green);` : '';
    avatarHTML = `<div class="hero-avatar" style="border-radius:${r}">
      <img src="${av.src}" alt="${C.name}"
        style="width:${av.width||130}px;height:${av.height||130}px;border-radius:${r};${br}position:relative;z-index:1;"/>
    </div>`;
  }

  /* console lines */
  const conLines = (C.consoleLines || []).map(l =>
    `<span class="hc-time">[${l.time}]</span> <span class="hc-info">INFO</span>  ${l.text}`
  ).join('<br>');

  /* typed title placeholders */
  const titleSpans = (C.heroLines || []).map((_, i) =>
    `<span class="tl" data-i="${i}"></span>`
  ).join('');

  sec.innerHTML = `
    <div class="hero-bg-text">DEV</div>
    <div class="hero-inner">
      ${avatarHTML}
      <div class="hero-content">
        <div class="hero-console">${conLines}</div>
        <h1 class="hero-title" id="htitle">${titleSpans}</h1>
        <p class="hero-bio" id="hbio">${C.heroBio || ''}</p>
        <div class="hero-cta" id="hcta">
          <a class="btn btn-primary" href="#projects">View my work</a>
          <a class="btn btn-ghost"   href="#contact">Get in touch</a>
        </div>
      </div>
    </div>
    <div class="stats-row" id="stats-row"></div>
  `;

  /* stats */
  const row = document.getElementById('stats-row');
  (C.stats || []).forEach(s => {
    row.innerHTML += `<div class="stat-item">
      <div class="stat-num">${s.num}</div>
      <div class="stat-label">${s.label}</div>
    </div>`;
  });

  /* typing animation */
  const lines = document.querySelectorAll('.tl');
  const heroLines = C.heroLines || [];
  let idx = 0;

  function typeLine(el, text, done) {
    el.classList.add('vis');
    el.textContent = '';
    let j = 0;
    const iv = setInterval(() => {
      el.textContent += text[j++];
      if (j >= text.length) { clearInterval(iv); if (done) setTimeout(done, 150); }
    }, 34);
  }

  function nextLine() {
    if (idx >= lines.length) {
      document.getElementById('hbio').classList.add('vis');
      setTimeout(() => document.getElementById('hcta').classList.add('vis'), 300);
      return;
    }
    typeLine(lines[idx], heroLines[idx], nextLine);
    idx++;
  }

  setTimeout(nextLine, 480);
})();

/* ── ABOUT ── */
(function() {
  const sec = document.getElementById('about');

  const paras = (C.aboutParagraphs || []).map(p => `<p>${p}</p>`).join('');

  const skillBlocks = (C.skillGroups || []).slice(0, 2).map(g => {
    const lines = g.lines.map(l => {
      const vc  = l.type === 'str' ? 'cs' : 'cv';
      const val = l.type === 'bool'
        ? (l.val === true ? 'true' : l.val === false ? 'false' : String(l.val))
        : `"${l.val}"`;
      return `<span class="ck">${l.key}</span>: <span class="${vc}">${val}</span>`;
    }).join('<br>');

    return `<div class="cfg-block">
      <div class="cfg-topbar"><span class="cf">${g.file}</span><span>${g.sub}</span></div>
      <div class="cfg-body">${lines}</div>
    </div>`;
  }).join('');

  sec.innerHTML = `
    <div class="eyebrow">01 / about</div>
    <h2 class="section-title">Who I am.</h2>
    <div class="about-grid">
      <div class="about-paras">${paras}</div>
      <div class="about-right">${skillBlocks}</div>
    </div>
  `;
})();

/* ── PROJECTS ── */
(function() {
  const sec  = document.getElementById('projects');
  sec.innerHTML = `
    <div class="eyebrow">02 / projects</div>
    <h2 class="section-title">Things I've built.</h2>
    <p class="section-sub">Click a project name to visit it. Click the image to expand.</p>
    <div class="projects-grid" id="pgrid"></div>
  `;

  const grid = document.getElementById('pgrid');

  (C.projects || []).forEach(p => {
    const card = ce('div', 'project-card');

    /* top bar */
    card.innerHTML += `<div class="pc-topbar">
      <span class="pc-dot"></span>
      ${p.type.toLowerCase()} &bull; ${p.loader}
      <span class="pc-badge">${p.version}</span>
    </div>`;

    /* image */
    const imgWrap = ce('div', 'pc-img');
    if (p.image && p.image.src) {
      imgWrap.style.height = p.image.height || '210px';
      const img = document.createElement('img');
      img.src = p.image.src; img.alt = p.name;
      img.style.height    = p.image.height || '210px';
      img.style.objectFit = p.image.fit    || 'cover';
      imgWrap.appendChild(img);
      imgWrap.innerHTML += `<div class="zoom-hint">↗ expand</div>`;
      imgWrap.addEventListener('click', () => openLB(p.image.src, p.name));
    } else {
      imgWrap.style.height = '110px';
      imgWrap.innerHTML = `<div class="img-ph">set image.src in config.js</div>`;
    }
    card.appendChild(imgWrap);

    /* body */
    const body = ce('div', 'pc-body');
    const tags = (p.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

    const nameEl = p.link
      ? `<a class="pc-name linkable" href="${p.link}" target="_blank" rel="noopener">${p.name}<span class="arr">↗</span></a>`
      : `<span class="pc-name">${p.name}</span>`;

    body.innerHTML = `
      <div class="pc-type">${p.type} / ${p.loader}</div>
      ${nameEl}
      <div class="pc-desc">${p.desc}</div>
      <div class="pc-tags">${tags}</div>
    `;
    card.appendChild(body);
    grid.appendChild(card);
  });
})();

/* ── CONTACT ── */
(function() {
  const sec = document.getElementById('contact');
  const dc  = C.contact || {};

  const cfgRows = [
    ['name',    C.name],
    ['role',    'MC Dev & Server Admin'],
    ['status',  C.status || ''],
    ['contact', 'Discord'],
    ['handle',  dc.discord || '']
  ].map(([k,v]) => `<span class="cp">${k}</span>:    <span class="cv">${v}</span>`).join('<br>');

  sec.innerHTML = `
    <div class="eyebrow">03 / contact</div>
    <h2 class="section-title">${dc.headline || "Let's build something."}</h2>
    <div class="contact-grid">
      <div class="contact-left">
        <p>${dc.body || ''}</p>
        <a class="discord-btn" id="dc-btn" href="${dc.discordUrl || '#'}" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.032.054a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
          </svg>
          <span class="dc-tag">${dc.discord || 'Discord'}</span>
          <span class="dc-copy-label">click to copy</span>
        </a>
      </div>
      <div class="contact-right">
        <div class="cr-bar"><span class="cf">contact.yml</span></div>
        <div class="cr-body">${cfgRows}</div>
      </div>
    </div>
  `;

  /* copy Discord on click */
  const btn = document.getElementById('dc-btn');
  if (btn && dc.discord) {
    btn.addEventListener('click', e => {
      e.preventDefault();
      navigator.clipboard.writeText(dc.discord).then(() => {
        btn.classList.add('copied');
        qs('.dc-copy-label', btn).textContent = 'copied!';
        showToast('Discord tag copied to clipboard');
        setTimeout(() => {
          btn.classList.remove('copied');
          qs('.dc-copy-label', btn).textContent = 'click to copy';
        }, 2200);
      }).catch(() => showToast('Could not copy — try manually.'));
    });
  }
})();

/* ── FOOTER ── */
(function() {
  const f = document.getElementById('footer');
  f.innerHTML = `
    <span>${C.name} &bull; ${new Date().getFullYear()}</span>
    <span class="footer-hint" id="footer-hint">built with java &amp; pain ⚔</span>
  `;
  document.getElementById('footer-hint').addEventListener('click', openEE);
})();

/* ── AUTOPLAY (start after DOM settles) ── */
window.addEventListener('load', () => {
  setTimeout(tryAutoplay, 300);
});
</script>
</body>
</html>
