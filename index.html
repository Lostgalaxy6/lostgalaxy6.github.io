<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Atlas</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f0c040;--gdim:#c09020;--amb:#e08020;
  --parch:#f5e6c0;--pdim:#d4c08a;
  --card:rgba(10,5,2,0.85);--bdr:rgba(240,192,64,0.55);--bdr2:rgba(240,192,64,0.9);
  --danger:#e04040;--safe:#50d080;
  --f:Georgia,'Times New Roman',serif;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--f);color:var(--parch);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:var(--f)}

.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s}
.scr.on{opacity:1;pointer-events:auto}

/* MENU */
#smenu{background:linear-gradient(170deg,#120a02,#2a1805 30%,#4a2e10 55%,#2a1805 78%,#120a02)}
#smenu::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 85%,rgba(255,200,80,.15),transparent 65%)}
.mi{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:22px;padding:30px 20px;width:100%;max-width:400px}
.globe{font-size:64px;line-height:1;animation:bob 3.5s ease-in-out infinite;
  filter:drop-shadow(0 0 18px rgba(240,192,64,.45))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.mtitle{font-size:clamp(36px,11vw,62px);font-weight:700;color:var(--gold);
  text-shadow:0 0 26px rgba(240,192,64,.6),0 2px 4px rgba(0,0,0,.9);
  letter-spacing:5px;text-align:center}
.msub{font-size:clamp(10px,3vw,13px);color:var(--pdim);letter-spacing:3px;
  text-align:center;text-transform:uppercase}
.mdiv{width:170px;height:1px;background:linear-gradient(to right,transparent,var(--gdim),transparent)}
.mprompt{font-size:clamp(11px,3.2vw,14px);color:var(--pdim);letter-spacing:2px;text-align:center}
.pbrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pbtn{min-width:94px;padding:14px 18px;background:var(--card);border:2px solid var(--bdr);
  border-radius:7px;color:var(--gold);font-size:clamp(13px,4vw,16px);
  font-weight:700;letter-spacing:2px;cursor:pointer}
.pbtn:active{background:rgba(240,192,64,.2)}
.mfoot{font-size:9px;color:rgba(200,180,120,.32);letter-spacing:2px}

/* NAMES */
#snames{background:linear-gradient(170deg,#120a02,#2a1805 30%,#4a2e10 60%,#120a02)}
.ncard{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:32px 24px;width:calc(100% - 32px);max-width:360px;
  display:flex;flex-direction:column;align-items:center;gap:18px;
  box-shadow:0 8px 28px rgba(0,0,0,.6)}
.nttl{font-size:clamp(16px,5vw,20px);color:var(--gold);letter-spacing:3px}
.nstp{font-size:clamp(11px,3vw,13px);color:var(--pdim)}
.ninp{width:100%;background:rgba(255,255,255,.05);border:1.5px solid var(--bdr);
  border-radius:6px;color:var(--parch);font-size:clamp(15px,4.5vw,18px);
  padding:12px 14px;text-align:center;outline:none}
.ninp:focus{border-color:var(--gold)}
.ninp::placeholder{color:rgba(200,180,120,.28)}
.bok{width:100%;padding:14px;background:linear-gradient(135deg,rgba(240,192,64,.18),rgba(200,130,20,.22));
  border:2px solid var(--bdr2);border-radius:6px;color:var(--gold);
  font-size:clamp(13px,4vw,16px);font-weight:700;letter-spacing:2px;cursor:pointer}
.bok:active{background:linear-gradient(135deg,rgba(240,192,64,.32),rgba(200,130,20,.36))}

/* GAME */
#sgame{flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:hidden}
.ssbg{position:fixed;inset:0;z-index:0;
  background:linear-gradient(to bottom,#1a0a2e,#2d1040 8%,#5c1a2a 22%,#8b2a1a 35%,
    #c4470f 50%,#e06a10 62%,#e8921a 72%,#f0b830 82%,#fae070 100%)}
.sssun{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);
  width:66px;height:66px;border-radius:50%;z-index:1;
  background:radial-gradient(circle,#fff9e0,#ffe066 35%,#ffaa00 65%,transparent 100%);
  box-shadow:0 0 40px 20px rgba(255,200,80,.5),0 0 80px 40px rgba(255,150,50,.28)}
.sstree{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);z-index:2}
.ssgrass{position:absolute;bottom:0;left:0;right:0;height:13%;z-index:3;
  background:linear-gradient(to bottom,#0d2a0a,#040f03);
  border-top:2px solid rgba(30,80,20,.55)}
.gui{position:relative;z-index:10;display:flex;flex-direction:column;
  height:100vh;height:100dvh;padding:9px 9px 0;gap:7px;overflow:hidden}

.pstrip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.pstrip::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 11px;border-radius:20px;font-size:clamp(9px,2.6vw,11px);
  white-space:nowrap;color:var(--pdim);background:var(--card);border:1px solid var(--bdr)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(240,192,64,.14)}
.chip.out{opacity:.3;text-decoration:line-through}
.pdot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--safe);margin-left:5px;vertical-align:middle}
.pdot.used{background:#555}

.tcard{background:var(--card);border:1px solid var(--bdr);border-radius:10px;
  padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tinfo{flex:1;min-width:0}
.tplayer{font-size:clamp(13px,4vw,17px);font-weight:700;color:var(--gold);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlrow{font-size:clamp(9px,2.8vw,11px);color:var(--pdim);margin-top:2px}
.tletter{color:var(--gold);font-weight:700;font-size:clamp(12px,3.8vw,15px)}
.chkb{font-size:10px;color:var(--amb);margin-top:3px;display:none;
  animation:blk 1s ease-in-out infinite}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.3}}

.twrap{position:relative;flex-shrink:0;width:60px;height:60px}
.tsvg{width:60px;height:60px;transform:rotate(-90deg)}
.ttrack{fill:none;stroke:rgba(240,192,64,.14);stroke-width:5}
.tarc{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:151;stroke-dashoffset:0;transition:stroke-dashoffset .2s linear}
.tarc.warn{stroke:var(--amb)}.tarc.danger{stroke:var(--danger)}
.tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(15px,4.8vw,19px);font-weight:700;color:var(--gold)}
.tnum.warn{color:var(--amb)}.tnum.danger{color:var(--danger)}

.lcard{background:var(--card);border:1px solid rgba(240,192,64,.22);border-radius:8px;
  padding:7px 12px;font-size:clamp(9px,2.6vw,11px);color:var(--pdim);text-align:center}
.lname{color:var(--parch);font-size:clamp(12px,3.6vw,15px);font-weight:600}

.irow{display:flex;gap:7px}
.pinp{flex:1;min-width:0;padding:11px 12px;background:rgba(0,0,0,.55);
  border:1.5px solid var(--bdr);border-radius:8px;color:var(--parch);
  font-size:clamp(13px,3.8vw,15px);outline:none}
.pinp:focus{border-color:var(--gold)}
.pinp::placeholder{color:rgba(200,180,120,.28)}
.pinp:disabled{opacity:.4}
.bsub{padding:0 13px;min-width:52px;background:linear-gradient(135deg,rgba(240,192,64,.22),rgba(200,130,20,.28));
  border:2px solid var(--bdr2);border-radius:8px;color:var(--gold);
  font-size:14px;font-weight:700;cursor:pointer}
.bsub:active{transform:scale(.95)}
.bsub:disabled{opacity:.35;cursor:default}

.arow{display:flex;gap:7px}
.abtn{flex:1;padding:9px 6px;background:var(--card);border:1px solid var(--bdr);
  border-radius:8px;color:var(--pdim);font-size:clamp(10px,2.8vw,12px);cursor:pointer;letter-spacing:1px}
.abtn:active{transform:scale(.97)}
.abtn.pass{color:var(--safe);border-color:rgba(80,208,128,.38)}
.abtn.pass:disabled{color:#555;border-color:#333;opacity:.45;cursor:default}
.abtn.pause{color:var(--amb);border-color:rgba(224,128,32,.38)}

.hcard{background:var(--card);border:1px solid rgba(240,192,64,.18);border-radius:8px;
  padding:7px 9px;flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.httl{font-size:9px;color:var(--pdim);letter-spacing:2px;margin-bottom:5px;opacity:.65;text-transform:uppercase}
.hlist{overflow-y:auto;flex:1;display:flex;flex-direction:column-reverse;gap:2px;
  scrollbar-width:thin;scrollbar-color:rgba(240,192,64,.18) transparent}
.hlist::-webkit-scrollbar{width:3px}
.hlist::-webkit-scrollbar-thumb{background:rgba(240,192,64,.18);border-radius:2px}
.hitem{font-size:clamp(9px,2.6vw,11px);color:var(--pdim);padding:2px 0;
  border-bottom:1px solid rgba(240,192,64,.06);
  display:flex;justify-content:space-between;align-items:center}
.hitem:last-child{border-bottom:none}
.hplace{color:var(--parch);font-weight:600}
.hby{font-size:9px;opacity:.5}
.hbadge{font-size:8px;padding:1px 4px;border-radius:6px;margin-left:3px}
.hbadge.v{color:var(--safe);border:1px solid rgba(80,208,128,.35)}
.hbadge.x{color:var(--danger);border:1px solid rgba(224,64,64,.35);text-decoration:line-through}

/* OVERLAYS */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:22px;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.ottl{font-size:24px;color:var(--gold);letter-spacing:3px;text-align:center}
.bres{padding:14px 34px;background:linear-gradient(135deg,rgba(240,192,64,.2),rgba(200,130,20,.26));
  border:2px solid var(--bdr2);border-radius:8px;color:var(--gold);
  font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer}
.pa-ttl{font-size:clamp(17px,5vw,22px);color:var(--gold);letter-spacing:3px;text-align:center}
.pa-sub{font-size:clamp(12px,3.4vw,15px);color:var(--pdim);text-align:center;line-height:1.8}
.pa-hi{color:var(--gold);font-weight:700}
.bacc{padding:14px 32px;background:linear-gradient(135deg,rgba(80,208,128,.2),rgba(40,160,80,.26));
  border:2px solid rgba(80,208,128,.65);border-radius:8px;color:var(--safe);
  font-size:clamp(13px,3.8vw,16px);font-weight:700;letter-spacing:2px;cursor:pointer}
.bacc:active{transform:scale(.97)}
.eico{font-size:46px}
.ettl{font-size:clamp(17px,5vw,22px);color:var(--danger);letter-spacing:3px;text-align:center}
.ename{font-size:clamp(20px,6vw,28px);color:var(--gold);font-weight:700;text-align:center}
.eason{font-size:clamp(11px,3vw,13px);color:var(--pdim);text-align:center}
.bcont{padding:13px 30px;background:var(--card);border:2px solid var(--bdr2);border-radius:8px;
  color:var(--gold);font-size:clamp(12px,3.8vw,15px);font-weight:700;letter-spacing:2px;cursor:pointer}

/* VAL OVERLAY */
.vov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.93);
  display:flex;align-items:center;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .25s}
.vov.on{opacity:1;pointer-events:auto}
.vcard{background:rgba(12,6,2,.97);border:1px solid var(--bdr);border-radius:14px;
  padding:22px 18px;width:100%;max-width:360px;
  display:flex;flex-direction:column;align-items:center;gap:12px}
.vspin-row{display:flex;align-items:center;gap:10px}
.vspin{width:20px;height:20px;border:3px solid rgba(240,192,64,.2);
  border-top-color:var(--gold);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vstxt{font-size:clamp(12px,3.5vw,14px);color:var(--pdim)}
.vpname{font-size:clamp(17px,5vw,23px);color:var(--gold);font-weight:700;
  letter-spacing:2px;text-align:center}
.vico{font-size:42px}
.vrttl{font-size:clamp(14px,4.2vw,18px);font-weight:700;letter-spacing:2px;text-align:center}
.vrsub{font-size:clamp(11px,3vw,13px);color:var(--pdim);text-align:center;line-height:1.6}
.vrsub b{color:var(--parch)}
.cok{color:var(--safe)}.cbad{color:var(--danger)}.cunc{color:var(--amb)}
.vdiv{width:100%;height:1px;background:linear-gradient(to right,transparent,var(--bdr),transparent)}
.vlbl{font-size:clamp(9px,2.6vw,11px);color:var(--pdim);letter-spacing:2px;
  text-align:center;text-transform:uppercase}
.vwho{font-size:clamp(13px,4vw,16px);color:var(--gold);font-weight:700;text-align:center}
.vq{font-size:clamp(11px,3vw,13px);color:var(--pdim);text-align:center;line-height:1.5}
.vbtns{display:flex;gap:14px;width:100%}
.vbtn{flex:1;padding:16px 0;border-radius:10px;border:2px solid;
  font-size:clamp(20px,6vw,26px);cursor:pointer;font-weight:700;background:transparent}
.vbtn:active{transform:scale(.94)}
.vbtn.y{border-color:rgba(80,208,128,.65);color:var(--safe)}
.vbtn.n{border-color:rgba(224,64,64,.65);color:var(--danger)}
.vtally{display:flex;gap:14px;font-size:clamp(11px,3vw,13px);color:var(--pdim)}
.vtv{color:var(--safe);font-weight:700}.vtn{color:var(--danger);font-weight:700}
.vpips{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.vpip{width:11px;height:11px;border-radius:50%;border:2px solid rgba(240,192,64,.35);background:transparent}
.vpip.y{background:var(--safe);border-color:var(--safe)}
.vpip.n{background:var(--danger);border-color:var(--danger)}

/* WIN */
#swin{background:linear-gradient(170deg,#120a02,#2a1805 30%,#4a2e10 60%,#120a02);overflow:hidden}
#swin::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 60%,rgba(255,220,80,.2),transparent 65%)}
.wi{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:18px;padding:30px 20px;width:100%;text-align:center}
.wtrophy{font-size:74px;animation:bob 3s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(240,192,64,.55))}
.wlbl{font-size:clamp(10px,2.8vw,13px);color:var(--pdim);letter-spacing:4px;text-transform:uppercase}
.wname{font-size:clamp(30px,9vw,52px);font-weight:700;color:var(--gold);
  text-shadow:0 0 26px rgba(240,192,64,.65),0 2px 4px rgba(0,0,0,.9)}
.wsub{font-size:clamp(12px,3.4vw,15px);color:var(--pdim);letter-spacing:2px}
.bagain{margin-top:6px;padding:14px 32px;
  background:linear-gradient(135deg,rgba(240,192,64,.18),rgba(200,130,20,.22));
  border:2px solid var(--bdr2);border-radius:8px;color:var(--gold);
  font-size:clamp(12px,3.8vw,15px);font-weight:700;letter-spacing:2px;cursor:pointer}
.bagain:active{transform:scale(.97)}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(20,10,2,.96);border:1.5px solid var(--bdr);
  border-radius:10px;padding:13px 22px;color:var(--parch);
  font-size:clamp(12px,3.6vw,14px);letter-spacing:1px;text-align:center;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:290px;
  line-height:1.5}
.toast.on{opacity:1}

.cf{position:fixed;pointer-events:none;z-index:1;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<audio id="bgm" loop preload="auto"><source src="Creator.mp3" type="audio/mpeg"></audio>

<!-- MENU -->
<div id="smenu" class="scr on">
  <div class="mi">
    <div class="globe">&#127757;</div>
    <div class="mtitle">ATLAS</div>
    <div class="msub">The Geography Word-Chain Game</div>
    <div class="mdiv"></div>
    <div class="mprompt">Select number of players</div>
    <div class="pbrow">
      <button class="pbtn" id="b2">2 Players</button>
      <button class="pbtn" id="b3">3 Players</button>
      <button class="pbtn" id="b4">4 Players</button>
    </div>
    <div class="mfoot">OFFLINE &middot; SINGLE FILE</div>
  </div>
</div>

<!-- NAMES -->
<div id="snames" class="scr">
  <div class="ncard">
    <div class="nttl">ENTER NAMES</div>
    <div class="nstp" id="nstp">Player 1 of 2</div>
    <input id="ninp" class="ninp" type="text" maxlength="18"
      autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="Name...">
    <button class="bok" id="nok">CONFIRM</button>
  </div>
</div>

<!-- GAME -->
<div id="sgame" class="scr">
  <div class="ssbg"></div>
  <div class="sssun"></div>
  <div class="sstree">
    <svg width="200" height="220" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <rect x="90" y="130" width="20" height="90" rx="4" fill="#090908"/>
      <path d="M100 210 Q80 216 65 222" stroke="#090908" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M100 210 Q120 216 135 222" stroke="#090908" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="100" cy="100" rx="85" ry="70" fill="#040b03"/>
      <ellipse cx="100" cy="72" rx="65" ry="55" fill="#050d04"/>
      <ellipse cx="100" cy="48" rx="48" ry="41" fill="#060f05"/>
      <ellipse cx="100" cy="29" rx="32" ry="28" fill="#050d04"/>
      <ellipse cx="100" cy="16" rx="20" ry="18" fill="#040b03"/>
    </svg>
  </div>
  <div class="ssgrass"></div>
  <div class="gui">
    <div class="pstrip" id="pstrip"></div>
    <div class="tcard">
      <div class="tinfo">
        <div class="tplayer" id="tplayer">-</div>
        <div class="tlrow">Start with: <span class="tletter" id="tletter">Any</span></div>
        <div class="chkb" id="chkb">Checking...</div>
      </div>
      <div class="twrap">
        <svg class="tsvg" viewBox="0 0 54 54">
          <circle class="ttrack" cx="27" cy="27" r="24"/>
          <circle class="tarc" id="tarc" cx="27" cy="27" r="24"/>
        </svg>
        <div class="tnum" id="tnum">70</div>
      </div>
    </div>
    <div class="lcard" id="lcard">Be the first to name a place!</div>
    <div class="irow">
      <input id="pinp" class="pinp" type="text" maxlength="60"
        autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="Enter any place...">
      <button class="bsub" id="bsub">OK</button>
    </div>
    <div class="arow">
      <button class="abtn pass" id="bpass">&#127467; Pass</button>
      <button class="abtn pause" id="bpause">&#9208; Pause</button>
    </div>
    <div class="hcard">
      <div class="httl">History</div>
      <div class="hlist" id="hlist"></div>
    </div>
  </div>
</div>

<!-- WIN -->
<div id="swin" class="scr">
  <div class="wi">
    <div class="wtrophy">&#127942;</div>
    <div class="wlbl">Champion of the Atlas</div>
    <div class="wname" id="wname">-</div>
    <div class="wsub">Knows the world better than anyone.</div>
    <button class="bagain" id="bagain">PLAY AGAIN</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- pause -->
<div class="ov" id="opause">
  <div class="ottl">&#9208; PAUSED</div>
  <button class="bres" id="bres">RESUME</button>
</div>

<!-- pass accept -->
<div class="ov" id="opass">
  <div class="pa-ttl">&#127467; PASS USED</div>
  <div class="pa-sub" id="opasstxt">-</div>
  <button class="bacc" id="bacc">I'M READY - TAP TO START</button>
</div>

<!-- elim -->
<div class="ov" id="oelim">
  <div class="eico">&#10060;</div>
  <div class="ettl">ELIMINATED</div>
  <div class="ename" id="ename">-</div>
  <div class="eason" id="eason">-</div>
  <button class="bcont" id="bcont">CONTINUE</button>
</div>

<!-- val -->
<div class="vov" id="vov">
  <div class="vcard" id="vcard"></div>
</div>

<script>
(function(){

/* ── ONLINE CHECK ───────────────────────────────── */
function checkOnline(place, cb) {
  var xhr = new XMLHttpRequest();
  var url = 'https://nominatim.openstreetmap.org/search?q=' +
            encodeURIComponent(place) + '&format=json&limit=3&accept-language=en';
  xhr.open('GET', url, true);
  xhr.timeout = 8000;
  var geo = {administrative:1,city:1,town:1,village:1,hamlet:1,suburb:1,neighbourhood:1,
    county:1,state:1,province:1,country:1,island:1,ocean:1,sea:1,lake:1,river:1,
    mountain:1,peak:1,range:1,region:1,bay:1,cape:1,gulf:1,strait:1,valley:1,
    plain:1,plateau:1,desert:1,park:1,natural:1,water:1,place:1,boundary:1,
    municipality:1,borough:1,district:1};
  xhr.onload = function(){
    try{
      var d = JSON.parse(xhr.responseText);
      if(!d||!d.length){ cb('no'); return; }
      for(var i=0;i<d.length;i++){
        var t=(d[i].type||'').toLowerCase();
        var c=(d[i].class||'').toLowerCase();
        if(geo[t]||c==='place'||c==='natural'||c==='boundary'||c==='water'){ cb('yes'); return; }
      }
      cb('unsure');
    } catch(e){ cb(null); }
  };
  xhr.onerror   = function(){ cb(null); };
  xhr.ontimeout = function(){ cb(null); };
  xhr.send();
}

function validate(place, cb) {
  var lower = place.toLowerCase().trim();
  if(DB[lower]){ cb('valid'); return; }
  checkOnline(place, function(r){
    if(r===null)      cb('offline');
    else if(r==='yes')     cb('valid');
    else if(r==='no')      cb('invalid');
    else                   cb('unsure');
  });
}

/* ── GAME INIT ──────────────────────────────────── */
function initGame(){
  players=[];
  for(var i=0;i<pNames.length;i++) players.push({name:pNames[i],passUsed:false,out:false});
  curIdx=0; used={}; hist=[]; curLetter='';
  started=true; paused=false; validating=false; pendPass=-1; elimCb=null; vState=null;
  showScr('sgame');
  renderStrip(); renderHist(); updateLast();
  setTimeout(function(){ startTurn(0); },300);
}

/* ── STRIP ──────────────────────────────────────── */
function renderStrip(){
  var s=g('pstrip'); s.innerHTML='';
  for(var i=0;i<players.length;i++){
    var p=players[i];
    var c=document.createElement('div');
    c.className='chip'+(i===curIdx&&!p.out?' on':'')+(p.out?' out':'');
    c.textContent=p.name;
    var d=document.createElement('span');
    d.className='pdot'+(p.passUsed?' used':'');
    c.appendChild(d);
    s.appendChild(c);
  }
}

/* ── TURN ───────────────────────────────────────── */
function alive(){
  var a=[];
  for(var i=0;i<players.length;i++) if(!players[i].out) a.push(players[i]);
  return a;
}
function nextIdx(from){
  var idx=(from+1)%players.length, t=0;
  while(players[idx].out){ idx=(idx+1)%players.length; if(++t>players.length) break; }
  return idx;
}
function startTurn(extra){
  stopTimer(); validating=false;
  var p=players[curIdx];
  tMax=70+(extra||0);
  g('tplayer').textContent=p.name+"'s Turn";
  g('tletter').textContent=curLetter?curLetter.toUpperCase():'Any';
  g('chkb').style.display='none';
  g('bpass').disabled=p.passUsed;
  g('pinp').disabled=false;
  g('bsub').disabled=false;
  var inp=g('pinp'); inp.value='';
  inp.placeholder=curLetter?'Must start with "'+curLetter.toUpperCase()+'"...':'Enter any place...';
  renderStrip();
  startTimer(tMax);
  try{ inp.focus(); }catch(e){}
}

/* ── TIMER (Date.now based — works on Android) ─── */
function startTimer(secs){
  stopTimer();
  tEnd = Date.now() + secs*1000;
  updateTimerDisplay(secs, secs);
  tTick = setInterval(function(){
    if(paused||validating) return;
    var remain = Math.ceil((tEnd - Date.now())/1000);
    if(remain < 0) remain = 0;
    updateTimerDisplay(remain, tMax);
    if(remain <= 0){
      stopTimer();
      elimPlayer(curIdx,'Ran out of time!');
    }
  }, 250);
}
function stopTimer(){
  if(tTick){ clearInterval(tTick); tTick=null; }
}
function pauseTimer(){
  tPauseRemain = tEnd - Date.now();
  stopTimer();
}
function resumeTimer(){
  tEnd = Date.now() + tPauseRemain;
  tTick = setInterval(function(){
    if(paused||validating) return;
    var remain = Math.ceil((tEnd - Date.now())/1000);
    if(remain < 0) remain = 0;
    updateTimerDisplay(remain, tMax);
    if(remain <= 0){
      stopTimer();
      elimPlayer(curIdx,'Ran out of time!');
    }
  }, 250);
}
function updateTimerDisplay(val, max){
  var arc=g('tarc'), num=g('tnum');
  if(!arc||!num) return;
  var ratio=Math.max(0,val/max);
  arc.style.strokeDashoffset=String(CIRC*(1-ratio));
  num.textContent=String(val);
  var c=val<=10?'danger':val<=20?'warn':'';
  arc.className='tarc'+(c?' '+c:'');
  num.className='tnum'+(c?' '+c:'');
}

/* ── SUBMIT ─────────────────────────────────────── */
function submitPlace(){
  if(paused||validating||pendPass>=0) return;
  var inp=g('pinp'), raw=inp.value.trim();
  if(!raw){ try{ inp.focus(); }catch(e){} return; }
  // capitalise each word
  var words=raw.split(' ');
  for(var i=0;i<words.length;i++)
    words[i]=words[i].charAt(0).toUpperCase()+words[i].slice(1).toLowerCase();
  var place=words.join(' ');
  var lower=place.toLowerCase();
  if(curLetter && lower[0]!==curLetter){
    toast('Must start with "'+curLetter.toUpperCase()+'"');
    try{ inp.select(); }catch(e){} return;
  }
  if(used[lower]){
    toast('Already used! Try another.');
    try{ inp.select(); }catch(e){} return;
  }
  // pause timer while checking
  validating=true;
  pauseTimer();
  inp.disabled=true; g('bsub').disabled=true; g('chkb').style.display='block';
  showVal(
    '<div class="vpname">'+esc(place)+'</div>'+
    '<div class="vspin-row"><div class="vspin"></div><div class="vstxt">Verifying...</div></div>'+
    '<div style="font-size:10px;color:var(--pdim);opacity:.55;text-align:center">Checking database &amp; OpenStreetMap</div>'
  );
  validate(place, function(res){
    g('chkb').style.display='none';
    validating=false;
    if(res==='valid'){
      hideVal();
      acceptPlace(place,lower);
    } else if(res==='invalid'){
      showValInvalid(place);
      // resume timer so player must keep trying
      resumeTimer();
    } else {
      // offline or unsure
      var n=alive().length;
      if(n<=2){
        hideVal();
        toast(res==='offline'?'Offline - accepted unverified':'Uncertain - accepted in 2-player');
        acceptPlace(place,lower);
      } else {
        startVote(place, res==='offline');
      }
    }
  });
}

function acceptPlace(place,lower){
  used[lower]=true;
  curLetter=lower[lower.length-1];
  hist.push({place:place,by:players[curIdx].name,ok:true});
  updateLast(place); renderHist();
  var nxt=nextIdx(curIdx);
  curIdx=nxt;
  startTurn(20);
}
function rejectPlace(place){
  hist.push({place:place,by:players[curIdx].name,ok:false});
  renderHist();
  g('pinp').disabled=false; g('bsub').disabled=false;
  g('pinp').value='';
  try{ g('pinp').focus(); }catch(e){}
}

/* ── VAL OVERLAY ────────────────────────────────── */
function showValInvalid(place){
  showVal(
    '<div class="vico">&#10060;</div>'+
    '<div class="vrttl cbad">Not a Real Place</div>'+
    '<div class="vpname" style="font-size:clamp(14px,4vw,18px)">'+esc(place)+'</div>'+
    '<div class="vrsub">Not found as a real geographical place.<br><b>Try a different place!</b></div>'+
    '<button class="bcont" id="vretry">TRY AGAIN</button>'
  );
  g('vretry').onclick=function(){
    hideVal();
    rejectPlace(place);
  };
}

/* ── VOTING ─────────────────────────────────────── */
function startVote(place,isOff){
  var voters=[];
  for(var i=0;i<players.length;i++)
    if(!players[i].out && i!==curIdx) voters.push(i);
  vState={place:place,voters:voters,vi:0,yes:0,no:0,picks:[]};
  renderVote(isOff);
  g('vov').classList.add('on');
}
function renderVote(isOff){
  var vs=vState;
  var voterIdx=vs.voters[vs.vi];
  var voterName=players[voterIdx].name;
  var submitter=players[curIdx].name;
  var total=vs.voters.length;
  var pips='';
  for(var i=0;i<total;i++){
    var pc='vpip';
    if(i<vs.vi) pc+=(vs.picks[i]?' y':' n');
    pips+='<div class="'+pc+'"></div>';
  }
  var note=isOff?'Could not verify (offline)':'System uncertain - players decide';
  g('vcard').innerHTML=
    '<div class="vico">&#10067;</div>'+
    '<div class="vrttl cunc">Disputed Place</div>'+
    '<div class="vpname" style="font-size:clamp(14px,4vw,18px)">'+esc(vs.place)+'</div>'+
    '<div class="vrsub">Said by <b>'+esc(submitter)+'</b><br>'+
    '<span style="color:var(--amb);font-size:10px">'+esc(note)+'</span></div>'+
    '<div class="vdiv"></div>'+
    '<div class="vlbl">PLAYER VOTE</div>'+
    '<div class="vwho">'+esc(voterName)+"'s vote</div>"+
    '<div class="vq">Is <b style="color:var(--parch)">'+esc(vs.place)+'</b> a real place?</div>'+
    '<div class="vbtns">'+
    '<button class="vbtn y" id="vby">YES &#9989;</button>'+
    '<button class="vbtn n" id="vbn">NO &#10060;</button>'+
    '</div>'+
    '<div class="vtally">'+
    '<span>YES <span class="vtv">'+vs.yes+'</span></span>'+
    '<span>NO <span class="vtn">'+vs.no+'</span></span>'+
    '</div>'+
    '<div class="vpips">'+pips+'</div>';
  // assign onclick fresh each render
  g('vby').onclick=function(){ castVote(true); };
  g('vbn').onclick=function(){ castVote(false); };
}
function castVote(yes){
  var vs=vState;
  vs.picks.push(yes);
  if(yes) vs.yes++; else vs.no++;
  vs.vi++;
  if(vs.vi>=vs.voters.length) resolveVote();
  else renderVote(false);
}
function resolveVote(){
  var vs=vState; hideVal(); vState=null;
  if(vs.yes>=vs.no){
    acceptPlace(vs.place,vs.place.toLowerCase());
    toast('Voted VALID ('+vs.yes+'-'+vs.no+') - turn advances!');
  } else {
    rejectPlace(vs.place);
    resumeTimer();
    toast('Voted INVALID ('+vs.no+'-'+vs.yes+') - try again!');
  }
}

/* ── LAST CARD ──────────────────────────────────── */
function updateLast(place){
  var card=g('lcard');
  var vh=[];
  for(var i=0;i<hist.length;i++) if(hist[i].ok) vh.push(hist[i]);
  if(!place&&!vh.length){ card.innerHTML='Be the first to name a place!'; return; }
  var p=place||(vh.length?vh[vh.length-1].place:'?');
  var ll=p[p.length-1].toUpperCase();
  card.innerHTML='Last: <span class="lname">'+esc(p)+'</span> &rarr; next starts with <span class="tletter">'+ll+'</span>';
}

/* ── HISTORY ────────────────────────────────────── */
function renderHist(){
  var list=g('hlist'); list.innerHTML='';
  for(var i=0;i<hist.length;i++){
    var item=hist[i];
    var d=document.createElement('div'); d.className='hitem';
    var badge=item.ok?'<span class="hbadge v">OK</span>':'<span class="hbadge x">X</span>';
    d.innerHTML='<span class="hplace">'+esc(item.place)+badge+'</span><span class="hby">'+esc(item.by)+'</span>';
    list.appendChild(d);
  }
}

/* ── PASS ───────────────────────────────────────── */
function usePass(){
  if(paused||validating) return;
  var p=players[curIdx];
  if(p.passUsed) return;
  // mark pass used and stop timer
  p.passUsed=true;
  pauseTimer();
  var nxt=nextIdx(curIdx);
  pendPass=nxt;
  var np=players[nxt];
  g('opasstxt').innerHTML=
    '<span class="pa-hi">'+esc(p.name)+'</span> used their pass.<br>'+
    '<span class="pa-hi">'+esc(np.name)+'</span>, it\'s your turn!<br><br>'+
    'Letter: <span class="pa-hi">'+(curLetter?curLetter.toUpperCase():'Any')+'</span>';
  showOv('opass');
}
function acceptPass(){
  if(pendPass<0) return;
  // BUG FIX: set curIdx to next player THEN start their turn fresh
  curIdx=pendPass;
  pendPass=-1;
  hideOv('opass');
  startTurn(20); // starts a completely fresh 90-second turn for the new player
}

/* ── PAUSE ──────────────────────────────────────── */
function togglePause(){
  if(pendPass>=0||validating) return;
  paused=!paused;
  if(paused){
    pauseTimer();
    showOv('opause');
  } else {
    hideOv('opause');
    resumeTimer();
  }
}

/* ── ELIM ───────────────────────────────────────── */
function elimPlayer(idx,reason){
  players[idx].out=true;
  g('ename').textContent=players[idx].name;
  g('eason').textContent=reason;
  showOv('oelim');
  var savedIdx=idx;
  elimCb=function(){
    var a=alive();
    if(a.length<=1){
      showWin(a.length?a[0].name:'???');
    } else {
      curIdx=nextIdx(savedIdx);
      if(players[curIdx].out) curIdx=nextIdx(curIdx);
      renderStrip();
      startTurn(20);
    }
  };
}
function dismissElim(){
  hideOv('oelim');
  if(elimCb){ var cb=elimCb; elimCb=null; cb(); }
}

/* ── WIN ────────────────────────────────────────── */
function showWin(name){
  stopTimer();
  g('wname').textContent=name;
  showScr('swin');
  confetti();
}
function confetti(){
  var cols=['#f0c040','#e08020','#50d080','#c040e0','#40a0e0','#e04060'];
  for(var i=0;i<50;i++){
    (function(i){
      var el=document.createElement('div'); el.className='cf';
      var sz=6+Math.random()*8;
      el.style.cssText='left:'+Math.random()*100+'vw;top:-12px;background:'+cols[i%6]+
        ';animation-duration:'+(2+Math.random()*2)+'s;animation-delay:'+Math.random()*1.2+'s'+
        ';width:'+sz+'px;height:'+sz+'px;border-radius:'+(Math.random()>.5?'50%':'2px')+';';
      document.body.appendChild(el);
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },4500);
    })(i);
  }
}

/* ── MENU RETURN ────────────────────────────────── */
function goMenu(){
  stopTimer();
  started=false; paused=false; validating=false; pendPass=-1; elimCb=null; vState=null;
  hideOv('opause'); hideOv('opass'); hideOv('oelim'); hideVal();
  showScr('smenu');
}

/* ── START ──────────────────────────────────────── */
if(document.readyState==='loading')
  document.addEventListener('DOMContentLoaded', boot);
else
  boot();

})();
</script>
</body>
</html>
